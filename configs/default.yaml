# Football Analyzer - default configuration.
# Every tunable number lives here, not in the code, so experiments don't need code changes.

models:
  players: models/players.pt     # YOLO26m fine-tuned: ball, goalkeeper, player, referee
  pitch: models/pitch.pt         # YOLO26m-pose fine-tuned: 32 pitch keypoints
  device: cpu                    # "cpu" on your laptop, "0" on Colab GPU

detection:
  imgsz: 1280                    # must match training resolution (ball is tiny)
  conf: 0.25                     # keep low-confidence boxes: ByteTrack uses them in its 2nd stage
  batch_size: 4                  # frames per forward pass
  people_nms_iou: 0.6            # merge duplicate player/goalkeeper boxes on the same person

tracking:
  lost_track_buffer: 60          # frames a lost track is kept alive (handles short occlusions)
  track_activation_threshold: 0.4
  minimum_consecutive_frames: 3  # a track must be seen 3 frames before it gets an ID
  minimum_iou_threshold: 0.1
  high_conf_det_threshold: 0.5   # boxes above -> stage 1 matching, below -> stage 2

paths:
  cache_dir: data/cache
  output_dir: outputs
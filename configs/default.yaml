# Football Analyzer - default configuration.
# Every tunable number lives here, not in the code, so experiments don't need code changes.

models:
  players: models/players.pt     # YOLO26m fine-tuned: ball, goalkeeper, player, referee
  pitch: models/pitch.pt         # YOLO26m-pose fine-tuned: 32 pitch keypoints
  device: cpu                    # "cpu" on your laptop, "0" on Colab GPU

classes:                         # must match the trained model's class names/ids
  ball: 0
  goalkeeper: 1
  player: 2
  referee: 3

detection:
  imgsz: 1280                    # must match training resolution (ball is tiny)
  conf: 0.25                     # keep low-confidence boxes: ByteTrack uses them in its 2nd stage
  batch_size: 4                  # frames per forward pass
  people_nms_iou: 0.6            # merge duplicate player/goalkeeper boxes on the same person

tracking:
  lost_track_buffer: 60          # frames a lost track is kept alive (handles short occlusions)
  track_activation_threshold: 0.4
  minimum_consecutive_frames: 3  # a track must be seen 3 frames before it gets an ID
  minimum_iou_threshold: 0.1
  high_conf_det_threshold: 0.5   # boxes above -> stage 1 matching, below -> stage 2

teams:
  sample_stride: 5               # read jersey colours from every 5th frame (enough, and faster)

ball:
  max_gap: 20                    # fill gaps up to 20 frames (~0.8 s); longer gaps stay empty
  max_jump_px: 60                # a real ball moves < 60 px per frame; bigger jumps = false detection

possession:
  max_dist_ratio: 0.6            # ball within 0.6 x player height of his feet -> he controls it

pitch:
  length: 105.0                  # metres (FIFA allows 100-110); Borussia-Park is 105 x 68
  width: 68.0
  keypoint_imgsz: 640            # must match the pitch model's training resolution
  keypoint_conf: 0.8             # real keypoints score 0.9+; false ones scored 0.6-0.7 (measured)
  keypoint_stride: 5             # run the pitch model every 5th frame, interpolate in between
  ransac_threshold_m: 1.0        # a keypoint more than 1 m off the fitted H is an outlier
  min_inliers: 5                 # need 5+ agreeing keypoints (4 always fit exactly = no proof)
  min_line_score: 0.1            # real video scores ~0.15-0.25 for the correct H (measured)
  max_gap_frames: 25             # never reuse a homography more than ~0.5 s away (camera moves)
  temporal_window: 3             # compare each key frame with 3 key frames on each side
  max_jump_m: 5.0                # camera view moving > 5 m vs. its neighbours = wrong homography

radar:
  width_ratio: 0.32              # radar width as a fraction of the video width
  opacity: 0.85

paths:
  cache_dir: data/cache
  output_dir: outputs